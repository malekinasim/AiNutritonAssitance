services:
  ollama-health-ai:
    image: ollama/ollama
    container_name: ollama-health-ai
    ports:
      - "11434:11434"
    volumes:
      - ollama-health-ai:/root/.ollama

  health-assistance:
    build: .
    container_name: health-assistance
    depends_on:
      - ollama-health-ai
    stdin_open: true
    tty: true
    environment:
      AI_BASE_URL: http://ollama:11434
      AI_MODEL: llama3.2
volumes:
  ollama-health-ai: